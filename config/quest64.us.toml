# N64Recomp config for the Dreamcast build of Quest 64 (US 1.0).
# Mirrors Quest64-Recomp's us.rev0.toml, plus gpr_32bit for the SH-4 runtime.

[input]
entrypoint = 0x80000400
# Paths are relative to this file.
rom_file_path = "../quest64.us.z64"
symbols_file_path = "../Quest64Syms/dump.toml"
output_func_path = "../build/recomp"
gpr_32bit = true

# Dreamcast code generation (tools/N64Recomp, this port's fork). Each option can be turned off on its own.
[codegen]
rdram_base = true
sp_subword_fold = true
regcache = "gpr+fpr"
delay_once = true
# Off: the game reads stack it never wrote. func_80025BD8's sp+0x28 is where func_80025E0C saved $s0
# (0x8008F92C, never a sound id); without that store a stale 0 skips the menu sound's stop.
skip_saves = false
lookup_cache = true
ret_trim = true
fpr_abi_sync = true
inline_leaves = 24

[patches]
stubs = [
    "func_800471B0", # libleo
    "func_8004793C", # libleo
    "func_8003C530",
]

ignored = [
    "__osBlockSum",
    "__osPfsReleasePages",
    "__osPfsDeclearPage",
]

# The game's pak check (Quest64-Recomp stubs it, which leaves a stale $v0 as its result). The
# original can end in __osGetID's raw SI commands, so the runtime answers instead.
[[patches.hook]]
func = "initPFSPaks"
text = "pak_check(rdram, ctx); return;"
before_vram = 0x80031ACC

# The main loop, once it has initialized the game again (func_80000EEC sets the intro's game mode):
# a soft reset goes to the title instead (cont.c).
[[patches.hook]]
func = "func_80000C50"
text = "soft_reset_reinit(rdram, ctx);"
before_vram = 0x80000E14

# Where it starts initializing: a soft reset stops the music and the room's sounds first.
[[patches.hook]]
func = "func_80000C50"
text = "soft_reset_stop_sound(rdram, ctx);"
before_vram = 0x80000DC4

# The floor probe's point-in-shape test, the game's costliest function in battle, in native code.
[[patches.hook]]
func = "func_8000F238"
text = "floor_shape_test(rdram, ctx); return;"
before_vram = 0x8000F238

# libultra's sinf and cosf, the game's busiest functions after the renderer's, in native code that
# does exactly their double-precision steps (runtime/src/sincos.c).
[[patches.hook]]
func = "__sinf_recomp"
text = "ultra_sinf(rdram, ctx); return;"
before_vram = 0x80035680

[[patches.hook]]
func = "__cosf_recomp"
text = "ultra_cosf(rdram, ctx); return;"
before_vram = 0x800361F0

# libultra's alAudioFrame, once the players' handlers have run ($s1 the synthesizer, $s3 the
# samples to make): the voices' updates go to the AICA, and $s3 = 0 skips the command list.
[[patches.hook]]
func = "func_80036A68"
text = "aica_audio_frame(rdram, ctx);"
before_vram = 0x80036C20

[[patches.hook]]
func = "func_80024690"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024690

[[patches.hook]]
func = "dma_write"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024260

# Rumble follows a sound effect as it actually starts. Delay 0 plays here ($a0 the id, $a3 the
# scaled volume). A delayed effect waits in func_80026658 and starts with $a0 the id and $a1 the
# volume. The jump pack plays the same pulses as the PC recomp (cont.c).
[[patches.hook]]
func = "func_800268D4"
text = "sfx_rumble(rdram, (int)(ctx->r4 & 255u), (int)(ctx->r7 & 255u));"
before_vram = 0x80026940

[[patches.hook]]
func = "func_80026658"
text = "sfx_rumble(rdram, (int)(ctx->r4 & 255u), (int)(ctx->r5 & 255u));"
before_vram = 0x80026790
